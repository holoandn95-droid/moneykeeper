<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucy&#39;s MoneyKeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --surface2:#F6F8F7; --line:#DCE3E1;
  --ink:#16302B; --muted:#5E716C; --brand:#0F5C4D; --brand-ink:#FFFFFF;
  --inc:#17895B; --exp:#C8453B; --sav:#B7791F; --inv:#3E56C4; --cash:#8FA39E;
  --shadow:0 1px 0 rgba(22,48,43,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1716; --surface:#16211F; --surface2:#1C2927; --line:#2A3937;
    --ink:#E6EFEC; --muted:#93A6A1; --brand:#3FB394; --brand-ink:#08211B;
    --inc:#4CC48D; --exp:#EE7468; --sav:#E0A64A; --inv:#8697F0; --cash:#5D716C;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1716; --surface:#16211F; --surface2:#1C2927; --line:#2A3937;
  --ink:#E6EFEC; --muted:#93A6A1; --brand:#3FB394; --brand-ink:#08211B;
  --inc:#4CC48D; --exp:#EE7468; --sav:#E0A64A; --inv:#8697F0; --cash:#5D716C;
  --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:0 14px 120px}

/* Header + period */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-.01em}
.sync{font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;margin-top:10px}
.seg button{flex:1;border:0;background:none;padding:7px 2px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.period{display:flex;align-items:center;gap:8px;margin-top:8px}
.period .lbl{flex:1;text-align:center;font-weight:700;font-size:15px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1;display:grid;place-items:center}
.custom{display:none;gap:8px;margin-top:8px}
.custom.on{display:flex}
.custom label{flex:1;font-size:12px;color:var(--muted)}
.custom input{width:100%;margin-top:2px}

/* Generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;box-shadow:var(--shadow)}
h2{font-size:15px;font-weight:700;margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
input[type=text],input[type=date],select,input[inputmode]{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-height:42px}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.hidden{display:none!important}

/* Hero */
.hero{background:var(--brand);color:var(--brand-ink);border:0;padding:18px 16px 16px}
.hero .k{font-size:13px;opacity:.85}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:2px 0 4px;word-break:break-word}
.hero .rate{font-size:13px;opacity:.9}
.ribbon{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:14px 0 8px;background:rgba(255,255,255,.18)}
.ribbon span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;opacity:.95}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .k{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .k::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.stat .v{font-size:18px;font-weight:700;margin-top:2px;word-break:break-word}
.stat .d{font-size:12px;margin-top:2px;color:var(--muted)}
.up{color:var(--exp)} .down{color:var(--inc)}

/* Bars */
.bar{margin:9px 0}
.bar .top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar .track{height:8px;background:var(--surface2);border-radius:4px;margin-top:5px;overflow:hidden}
.bar .fill{height:100%;border-radius:4px}

/* Transactions */
.dayhead{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600;padding:14px 4px 6px}
.tx{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px}
.tx .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:var(--surface2);flex:none}
.tx .mid{flex:1;min-width:0}
.tx .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-weight:700;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Chart */
.chartwrap{overflow-x:auto;margin:0 -4px}
.chartwrap svg{display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
tfoot td{font-weight:700;border-bottom:0}
.tablewrap{overflow-x:auto}

/* Nav + FAB */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{max-width:560px;margin:0 auto;display:flex}
nav button{flex:1;border:0;background:none;padding:9px 0 10px;font-size:11.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .e{font-size:19px;line-height:1.1;filter:grayscale(1);opacity:.7}
nav button[aria-current="page"]{color:var(--brand)}
nav button[aria-current="page"] .e{filter:none;opacity:1}
.fab{position:fixed;z-index:7;right:max(16px,calc(50% - 264px));bottom:calc(74px + env(safe-area-inset-bottom,0px));height:54px;padding:0 20px 0 16px;border-radius:27px;border:0;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(15,92,77,.35);display:flex;align-items:center;gap:6px}
.fab b{font-size:24px;font-weight:500;line-height:1}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(5,15,13,.45);z-index:20;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;max-height:92%;overflow-y:auto;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s ease}
.sheet.on{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.field{margin-top:12px}
.field>span{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:5px}
.amount{font-size:28px!important;font-weight:800;text-align:right;min-height:56px!important}
.quick{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cat{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:8px 2px 7px;font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2;text-align:center;min-height:62px}
.cat .e{font-size:20px}
.cat[aria-pressed="true"]{border-color:var(--tc);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--tc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:15px;background:var(--brand);color:var(--brand-ink);margin-top:16px}
.btn.ghost{background:var(--surface2);color:var(--exp);border:1px solid var(--line);margin-top:8px}
.err{color:var(--exp);font-size:13px;margin-top:8px;min-height:1em}
.typeseg button[aria-pressed="true"]{color:var(--tc)}

/* Settings */
.list .item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.list .item input{flex:1}
.list .em{width:52px!important;text-align:center;flex:none!important}
.del{border:1px solid var(--line);background:var(--surface2);border-radius:10px;width:42px;height:42px;flex:none;color:var(--exp);font-size:17px}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow .go{flex:none;border:0;background:var(--brand);color:var(--brand-ink);border-radius:10px;padding:0 16px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
input[type=password]{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-height:42px}
.lockscr{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
.lockscr[hidden]{display:none}
.lockbox{width:100%;max-width:360px;text-align:center}
.lockic{width:72px;height:72px;border-radius:22px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:34px;margin:0 auto 14px}
.lockbox h2{font-size:20px;margin:0 0 4px}
.lockbox p{color:var(--muted);margin:0 0 16px}
.lockbox input{text-align:center;font-size:18px;min-height:50px}
.warn{background:color-mix(in srgb,var(--exp) 12%,transparent);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}
.okmsg{color:var(--inc)}
.hbtns{display:flex;align-items:center;gap:8px}
:root{--gold:#9A7300}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gold:#D9B44A}}
:root[data-theme="dark"]{--gold:#D9B44A}
.savc{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.savc .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.savc .nm{font-weight:700}
.savc .bk{font-size:12.5px;color:var(--muted)}
.savc .row{padding:2px 0}
.badge{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);white-space:nowrap}
.badge.warn2{background:color-mix(in srgb,var(--sav) 24%,transparent)}
.badge.done{background:color-mix(in srgb,var(--inc) 20%,transparent)}
.savc .amt2{font-size:22px;font-weight:800;margin:6px 0 2px}
.prog{height:6px;border-radius:3px;background:var(--surface2);margin:8px 0 6px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--sav)}
.preview{background:var(--surface2);border-radius:12px;padding:10px 12px;margin-top:14px}
.preview .row{padding:3px 0;font-size:14px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px}
.check input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--brand)}
select:disabled{opacity:.55}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:600;margin-top:12px;padding:6px;font-size:14px}
.lockbox .stack input{margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="titlebar">
      <h1>Sổ tài chính gia đình</h1>
      <div class="hbtns"><span class="sync" id="sync">Đang tải…</span><button class="iconbtn hidden" id="lockBtn" aria-label="Khóa sổ" title="Khóa sổ">🔒</button></div>
    </div>
    <div class="seg" id="modeSeg" role="group" aria-label="Chọn mốc thời gian">
      <button data-m="day">Ngày</button><button data-m="week">Tuần</button><button data-m="month">Tháng</button><button data-m="year">Năm</button><button data-m="custom">Tùy chọn</button>
    </div>
    <div class="period" id="periodNav">
      <button class="iconbtn" id="prev" aria-label="Kỳ trước">‹</button>
      <div class="lbl num" id="plabel"></div>
      <button class="iconbtn" id="next" aria-label="Kỳ sau">›</button>
    </div>
    <div class="custom" id="custom">
      <label>Từ ngày<input type="date" id="cFrom"></label>
      <label>Đến ngày<input type="date" id="cTo"></label>
    </div>
  </header>

  <main>
    <section id="v-overview"></section>
    <section id="v-ledger" class="hidden"></section>
    <section id="v-savings" class="hidden"></section>
    <section id="v-report" class="hidden"></section>
    <section id="v-settings" class="hidden"></section>
  </main>
</div>

<button class="fab" id="fab"><b>+</b> Thêm</button>

<nav><div class="in">
  <button data-v="overview" aria-current="page"><span class="e">🏠</span>Tổng quan</button>
  <button data-v="ledger"><span class="e">📒</span>Sổ thu chi</button>
  <button data-v="savings"><span class="e">🏦</span>Tài sản</button>
  <button data-v="report"><span class="e">📊</span>Báo cáo</button>
  <button data-v="settings"><span class="e">⚙️</span>Cài đặt</button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grab"></div>
  <div class="row"><h2 id="sheetTitle" style="margin:0">Thêm giao dịch</h2><button class="iconbtn" id="closeSheet" aria-label="Đóng">✕</button></div>
  <div class="seg typeseg" id="fType" role="group" aria-label="Loại giao dịch">
    <button data-t="expense" style="--tc:var(--exp)">Chi tiêu</button>
    <button data-t="income" style="--tc:var(--inc)">Thu nhập</button>
    <button data-t="saving" style="--tc:var(--sav)">Tiết kiệm</button>
    <button data-t="invest" style="--tc:var(--inv)">Đầu tư</button>
  </div>
  <div class="seg hidden" id="fDir" role="group" aria-label="Chiều tiền" style="margin-top:8px"><button data-d="in">Gửi vào</button><button data-d="out">Rút ra</button></div>
  <div class="field"><span>Số tiền (đồng)</span>
    <input class="amount num" id="fAmount" inputmode="numeric" autocomplete="off" placeholder="0">
    <div class="quick">
      <button data-q="000">+000</button><button data-q="k50">+50.000</button><button data-q="k100">+100.000</button><button data-q="k500">+500.000</button><button data-q="clr">Xóa</button>
    </div>
  </div>
  <div class="field"><span>Hạng mục</span><div class="cats" id="fCats"></div></div>
  <div class="warn hidden" id="fGoldHint">Muốn lưu loại vàng (nhẫn, miếng), khối lượng và giá từng lần mua, hãy ghi ở mục Vàng. <button class="linkbtn" id="toGold" style="margin:0;padding:0 0 0 2px">Mở Tài sản → Vàng</button></div>
  <div class="two">
    <div class="field"><span>Ngày</span><input type="date" id="fDate"></div>
    <div class="field" id="fMemberWrap"><span>Người chi/nhận</span><select id="fMember"></select></div>
  </div>
  <div class="field"><span>Ghi chú</span><input type="text" id="fNote" maxlength="140" placeholder="Ví dụ: đi chợ cuối tuần"></div>
  <div class="err" id="fErr" role="alert"></div>
  <button class="btn" id="fSave">Lưu giao dịch</button>
  <button class="btn ghost hidden" id="fDel">Xóa giao dịch</button>
</div>
<div class="sheet" id="ssheet" role="dialog" aria-modal="true" aria-label="Sổ tiết kiệm"></div>
<div class="toast" id="toast" role="status"></div>
<div class="lockscr" id="lockscr" hidden>
  <div class="lockbox">
    <div class="lockic">🔒</div>
    <h2>Sổ tài chính gia đình</h2>
    <p id="lockMsg">Nhập mật khẩu để mở sổ.</p>
    <div id="lockForm">
      <input type="password" id="lockPw" autocomplete="current-password" placeholder="Mật khẩu" aria-label="Mật khẩu">
      <button class="btn" id="lockGo">Mở khóa</button>
      <div class="err" id="lockErr" role="alert"></div>
      <button class="linkbtn hidden" id="toRecover">Quên mật khẩu? Dùng mã khôi phục</button>
    </div>
    <div id="recForm" class="hidden stack">
      <input type="text" id="recCode" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Mã khôi phục" aria-label="Mã khôi phục">
      <input type="password" id="recPw" autocomplete="new-password" placeholder="Mật khẩu mới" aria-label="Mật khẩu mới">
      <input type="password" id="recPw2" autocomplete="new-password" placeholder="Nhập lại mật khẩu mới" aria-label="Nhập lại mật khẩu mới">
      <button class="btn" id="recGo">Khôi phục và mở sổ</button>
      <div class="err" id="recErr" role="alert"></div>
      <button class="linkbtn" id="backToPw">Quay lại nhập mật khẩu</button>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";
/* ---------- Constants ---------- */
const TYPES = {
  expense:{label:"Chi tiêu", color:"var(--exp)"},
  income:{label:"Thu nhập", color:"var(--inc)"},
  saving:{label:"Tiết kiệm", color:"var(--sav)"},
  invest:{label:"Đầu tư", color:"var(--inv)"}
};
const TYPE_KEYS = ["expense","income","saving","invest"];
const DEFAULT_CATS = {
  expense:[["an","🍜","Ăn uống"],["cho","🛒","Đi chợ"],["nha","🏠","Nhà ở"],["dien","💡","Điện nước, mạng"],["dilai","⛽","Đi lại, xăng xe"],["con","🎒","Con cái, học phí"],["yte","💊","Y tế"],["muasam","👕","Mua sắm"],["hieuhi","🎁","Hiếu hỉ"],["giaitri","🎬","Giải trí, du lịch"],["baohiem","🛡️","Bảo hiểm"],["no","💳","Trả nợ"],["chikhac","📦","Chi khác"]],
  income:[["luong","💼","Lương"],["thuong","🎉","Thưởng"],["kinhdoanh","🏪","Kinh doanh"],["laidt","📈","Lãi, cổ tức"],["chothue","🔑","Cho thuê"],["thukhac","💰","Thu khác"]],
  saving:[["guinh","🏦","Gửi ngân hàng"],["khancap","🆘","Quỹ khẩn cấp"],["hoctap","🎓","Quỹ học tập"],["tkkhac","🐷","Tiết kiệm khác"]],

    for (let i = 0; i < list.length; i++){
      if (i % 20 === 0) pwMsg(`${label} ${i}/${list.length} giao dịch…`, true);
      const body = await txBody(list[i]);
      await withRetry(() => db.collection("tx").doc(list[i].id).set(body));
    }
    for (const re of S.reals.slice()){ const body = await txBody(re); await withRetry(() => db.collection("real").doc(re.id).set(body)); }
    for (const gd of S.golds.slice()){ const body = await txBody(gd); await withRetry(() => db.collection("gold").doc(gd.id).set(body)); }
    for (const sv of S.savs.slice()){ const body = await txBody(sv); await withRetry(() => db.collection("sav").doc(sv.id).set(body)); }
    await saveConfig();
  } finally { migrating = false; }
}
async function encryptAll(){
  if (S.store !== "db" || !encrypting()) return;
  try { await rewriteAll("Đang mã hóa"); pwMsg("", true); } catch(e){ pwMsg("Chưa mã hóa xong. Mở lại trang để tiếp tục."); }
}
async function setPassword(pw, code){
  const raw = crypto.getRandomValues(new Uint8Array(32));
  const lock = await makeLock(pw, raw);
  if (code) Object.assign(lock, await recoveryFields(code, raw));
  const key = await importDek(raw);
  if (S.store === "db"){
    S.lock = lock; S.key = key; S.dekRaw = raw;
    try { await withRetry(() => db.doc("config/lock").set(lock)); }
    catch(e){
      S.lock = null; S.key = null; S.dekRaw = null; render();
      throw new Error(e && e.code === "invalid_argument" ? "Chỉ chủ sở hữu hoặc Editor của trang mới đặt được mật khẩu." : "Chưa lưu được. Kiểm tra kết nối rồi thử lại.");
    }
    await rewriteAll("Đang mã hóa");
  } else {
    S.lock = lock; S.key = key; S.dekRaw = raw;
    await saveLocal();
  }
}
async function changePassword(cur, pw){
  const raw = await openLock(S.lock, cur);
  if (!raw) throw new Error("Mật khẩu hiện tại không đúng.");
  await writeLock(keepRecovery(S.lock, await makeLock(pw, raw)));
}
async function setRecovery(code){
  if (!S.dekRaw) throw new Error("Hãy mở khóa sổ trước.");
  const L = S.lock;
  await writeLock(Object.assign({v:1, salt:L.salt, wrapped:L.wrapped, iter:L.iter}, await recoveryFields(code, S.dekRaw)));
}
async function clearRecovery(){
  const L = S.lock;
  await writeLock({v:1, salt:L.salt, wrapped:L.wrapped, iter:L.iter});
}
async function recoverWithCode(code, pw){
  const raw = await openRecovery(S.lock, code);
  if (!raw) return false;
  const key = await importDek(raw);
  if (S.store === "local"){
    try { const d = await decObj(key, S.localEnc); applyLocal(d); }
    catch(e){ return false; }
  }
  S.key = key; S.dekRaw = raw; S.recMode = false;
  let saved = true;
  try { await writeLock(keepRecovery(S.lock, await makeLock(pw, raw))); } catch(e){ saved = false; }
  render(); processTx(); processConfig();
  return saved ? "saved" : "unsaved";
}
async function removePassword(cur){
  const raw = await openLock(S.lock, cur);
  if (!raw) throw new Error("Mật khẩu hiện tại không đúng.");
  if (S.store === "db"){
    S.removing = true;
    try {
      await rewriteAll("Đang giải mã");
      await withRetry(() => db.doc("config/lock").delete());
    } catch(e){ S.removing = false; throw new Error(e && e.code === "invalid_argument" ? "Chỉ chủ sở hữu hoặc Editor của trang mới gỡ được mật khẩu." : "Chưa gỡ xong. Thử lại."); }
    S.lock = null; S.key = null; S.dekRaw = null; S.removing = false;
  } else {
    S.lock = null; S.key = null; S.dekRaw = null; S.localEnc = "";
    await saveLocal();
  }
}
async function unlock(pw){
  const raw = await openLock(S.lock, pw);
  if (!raw) return false;
  const key = await importDek(raw);
  if (S.store === "local"){
    try { const d = await decObj(key, S.localEnc); applyLocal(d); }
    catch(e){ return false; }
  }
  S.key = key; S.dekRaw = raw;
  render(); processTx(); processConfig();
  return true;
}
function lockNow(){
  if (!S.lock) return;
  S.key = null; S.dekRaw = null; decCache.clear(); procSeq++;
  S.txs = []; S.savs = []; decSavCache.clear(); S.golds = []; decGoldCache.clear(); S.reals = []; decRealCache.clear(); S.config = defaultConfig(); S.pwMsg = null; S.recMode = false;
  closeSheet(); render();
}

function txRow(t){
  const c = catOf(t.type, t.cat);

  const sub = [t.wd ? "Rút " + TYPES[t.type].label.toLowerCase() : TYPES[t.type].label, t.member, t.note].filter(Boolean).map(esc).join(", ");
  return `<button class="tx" data-id="${esc(t.id)}">

    <span class="amt num" style="color:${TYPES[t.type].color}">${sign}${NF.format(t.amount)}</span></button>`;
}
const sortTx = list => list.slice().sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.createdAt - a.createdAt));
function barList(entries, total, color){
  entries = entries.filter(e => e.v > 0);
  if (!entries.length) return `<div class="empty small">Chưa có dữ liệu trong kỳ này.</div>`;
  return entries.map(e => {
    const p = total > 0 ? Math.round(e.v / total * 1000) / 10 : 0;
    return `<div class="bar"><div class="top"><span>${esc(e.icon||"")} ${esc(e.name)}</span><span class="num"><b>${NF.format(e.v)}</b> <span class="muted small">${NF.format(p)}%</span></span></div>
      <div class="track"><div class="fill" style="width:${Math.max(p,0.5)}%;background:${color}"></div></div></div>`;
  }).join("");
}
function byCategory(list, type){
  const m = new Map();
  for (const t of list) if (t.type === type) m.set(t.cat, (m.get(t.cat)||0) + (t.wd ? -t.amount : t.amount));
  return [...m].map(([id,v]) => { const c = catOf(type,id); return {name:c.name, icon:c.icon, v}; }).sort((a,b) => b.v - a.v);
}

function chartSVG(b){
  const n = b.list.length, W = Math.max(340, n*26), H = 190, padL = 40, padB = 24, padT = 8;
  const max = Math.max(1, ...b.list.map(x => Math.max(x.sum.income, x.sum.expense)));
  const step = (W - padL - 6) / n, bw = Math.max(3, Math.min(14, step*0.34));
  const y = v => padT + (H - padT - padB) * (1 - v/max);
  let g = "";
  for (let i = 0; i <= 3; i++){
    const v = max * i/3, yy = y(v);
    g += `<line x1="${padL}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${padL-6}" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--muted)">${esc(short(Math.round(v)))}</text>`;
  }
  const every = Math.ceil(n / 12);
  b.list.forEach((x,i) => {
    const cx = padL + step*i + step/2;
    g += `<rect x="${cx-bw-1}" y="${y(x.sum.income)}" width="${bw}" height="${Math.max(0,y(0)-y(x.sum.income))}" rx="2" fill="var(--inc)"><title>${esc(x.label)}: thu ${money(x.sum.income)}</title></rect>`;
    g += `<rect x="${cx+1}" y="${y(x.sum.expense)}" width="${bw}" height="${Math.max(0,y(0)-y(x.sum.expense))}" rx="2" fill="var(--exp)"><title>${esc(x.label)}: chi ${money(x.sum.expense)}</title></rect>`;
    if (i % every === 0) g += `<text x="${cx}" y="${H-7}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(x.tick)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:max(100%, ${W}px);height:auto" role="img" aria-label="Biểu đồ thu và chi theo thời gian">${g}</svg>`;
}

/* ---------- Savings books (sổ tiết kiệm) ---------- */
const diffDays = (a,b) => Math.round((parse(b) - parse(a)) / 864e5);
function addMonths(s, n){
  const d = parse(s), last = new Date(d.getFullYear(), d.getMonth()+n+1, 0).getDate();
  return ymd(new Date(d.getFullYear(), d.getMonth()+n, Math.min(d.getDate(), last)));
}
/* Lãi = gốc × lãi suất năm × số ngày thực gửi ÷ 365. rX100 = lãi suất × 100 (5,5% → 550). Số nguyên chính xác, làm tròn đến đồng. */
function interestOf(P, rX100, days){
  if (P <= 0 || rX100 <= 0 || days <= 0) return 0;
  const num = BigInt(P) * BigInt(rX100) * BigInt(days), den = 3650000n;
  return Number((num * 2n + den) / (2n * den));
}
const rateStr = x => String(x/100).replace(".", ",");
const fmtRate = x => rateStr(x) + "%/năm";
function parseRate(v){
  const t = String(v).trim().replace(",", ".");
  if (!/^\d{1,3}(\.\d{1,3})?$/.test(t)) return NaN;
  return Math.round(parseFloat(t) * 100);
}
const TERM_OPTS = [0,1,2,3,6,9,12,13,18,24,36];
const termName = t => t ? t + " tháng" : "Không kỳ hạn";
const ROLL = {none:"Không tái tục, rút cả gốc và lãi", principal:"Tái tục gốc, rút lãi", all:"Tái tục cả gốc và lãi"};
function cleanSav(id, d){
  if (!d || !Number.isSafeInteger(d.principal) || d.principal <= 0 || d.principal > 1e14 || !isYmd(d.start)) return null;
  const rate = Number(d.rate), nt = Number(d.ntRate), term = Number(d.term);
  if (!Number.isInteger(rate) || rate < 0 || rate > 10000 || !Number.isInteger(term) || term < 0 || term > 120) return null;
  const s = {id, name:String(d.name||"").slice(0,60), bank:String(d.bank||"").slice(0,60), principal:d.principal, rate, term, start:d.start,
    pay: d.pay === "monthly" && term ? "monthly" : "end",
    roll: term && ["none","principal","all"].includes(d.roll) ? d.roll : "none",
    ntRate: Number.isInteger(nt) && nt >= 0 && nt <= 10000 ? nt : 10,
    member:String(d.member||"").slice(0,40), note:String(d.note||"").slice(0,140), createdAt:Number(d.createdAt)||0, closed:null};
  if (s.pay === "monthly" && s.roll === "all") s.roll = "principal";
  const c = d.closed;
  if (c && isYmd(c.date) && Number.isSafeInteger(c.payout) && Number.isSafeInteger(c.interest)) s.closed = {date:c.date, payout:c.payout, interest:c.interest};
  return s;
}
const savName = s => s.name || s.bank || "Sổ tiết kiệm";
/* Các kỳ gửi đến ngày asOf (có tái tục). Ngày đến hạn tính từ ngày gửi gốc để không lệch ngày. */
function savCycles(s, asOf){
  const out = [];
  if (!s.term) return out;
  let start = s.start, P = s.principal;
  for (let k = 1; k <= 600; k++){
    const end = addMonths(s.start, s.term * k);
    let I = 0; const months = [];
    if (s.pay === "monthly"){
      for (let i = 1; i <= s.term; i++){
        const a = addMonths(s.start, s.term*(k-1) + i - 1), b = addMonths(s.start, s.term*(k-1) + i);
        const v = interestOf(P, s.rate, diffDays(a, b)); months.push({from:a, end:b, v}); I += v;
      }
    } else I = interestOf(P, s.rate, diffDays(start, end));
    out.push({k, start, end, P, I, months});
    if (end > asOf || s.roll === "none") break;
    start = end;
    if (s.roll === "all") P = P + I;
  }
  return out;
}
/* Tình trạng sổ nếu tất toán vào ngày asOf */
function savState(s, asOf){
  if (!s.term){
    const days = Math.max(0, diffDays(s.start, asOf)), I = interestOf(s.principal, s.rate, days);
    return {kind:"demand", P:s.principal, days, accrued:I, due:I, payout:s.principal + I, totalInterest:I, receivedPrev:0};
  }
  const cyc = savCycles(s, asOf), c = cyc[cyc.length-1];
  let receivedPrev = 0;
  if (s.roll === "principal") for (const x of cyc.slice(0, -1)) receivedPrev += x.I;
  const capitalized = c.P - s.principal;
  if (asOf >= c.end){
    const base = s.pay === "monthly" ? c.P : c.P + c.I;
    const post = interestOf(base, s.ntRate, diffDays(c.end, asOf));
    const due = (s.pay === "monthly" ? 0 : c.I) + post;
    return {kind:"matured", cycles:cyc, cycle:c, P:c.P, post, due, payout:c.P + due, receivedPrev,
            paidInCycle: s.pay === "monthly" ? c.I : 0, totalInterest: capitalized + receivedPrev + c.I + post};
  }
  const days = diffDays(c.start, asOf), termDays = diffDays(c.start, c.end);
  const paidInCycle = s.pay === "monthly" ? c.months.filter(m => m.end <= asOf).reduce((a,m) => a + m.v, 0) : 0;
  const early = interestOf(c.P, s.ntRate, days);
  const due = early - paidInCycle;
  return {kind:"active", cycles:cyc, cycle:c, P:c.P, days, termDays, left:diffDays(asOf, c.end),
          accrued:interestOf(c.P, s.rate, days), atMaturity:c.I, early, paidInCycle, due, payout:c.P + due,
          receivedPrev, totalInterest: capitalized + receivedPrev + early};
}
const pickCat = (type, pref) => { const cs = S.config.categories[type] || []; return (cs.find(c => c.id === pref) || cs[0] || {id:pref}).id; };

function renderSavings(){
  const today = ymd(new Date());
  const open = S.savs.filter(s => !s.closed), closed = S.savs.filter(s => s.closed);
  let P = 0, accrued = 0, atMat = 0, soon = 0;
  const st = new Map();
  for (const s of open){
    const x = savState(s, today); st.set(s.id, x); P += x.P;
    if (x.kind === "active"){ accrued += x.accrued; atMat += x.atMaturity; if (x.left <= 7) soon++; }
    else if (x.kind === "demand") accrued += x.accrued;
    else { accrued += x.due; soon++; }
  }
  const earned = closed.reduce((a,s) => a + s.closed.interest, 0);
  const key = s => { const x = st.get(s.id); return x.kind === "demand" ? "9999" : x.cycle.end; };
  open.sort((a,b) => key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : 0);
  closed.sort((a,b) => a.closed.date < b.closed.date ? 1 : -1);
  $("#v-savings").innerHTML = assetSeg() + `
    <div class="card hero" style="background:var(--sav)">
      <div class="k">Đang gửi tiết kiệm (${open.length} sổ)</div>

      <div class="legend" style="margin-top:8px">
        <span>Lãi tạm tính đến hôm nay ${short(accrued)}</span>
        <span>Lãi khi đến hạn ${short(atMat)}</span>
        ${earned ? `<span>Lãi đã nhận từ sổ đã tất toán ${short(earned)}</span>` : ""}
      </div>
    </div>
    ${soon ? `<div class="warn">Có ${soon} sổ đã đến hạn hoặc đến hạn trong 7 ngày tới.</div>` : ""}
    <button class="btn" data-sav-new>+ Mở sổ tiết kiệm</button>
    ${open.length ? open.map(s => savCard(s, st.get(s.id))).join("") : `<div class="empty">Chưa có sổ tiết kiệm nào. Bấm <b>+ Mở sổ tiết kiệm</b>, nhập số tiền, lãi suất và kỳ hạn để ứng dụng tự tính lãi.</div>`}
    ${closed.length ? `<h2 style="margin:22px 4px 0">Sổ đã tất toán</h2>${closed.map(s => savCard(s, null)).join("")}` : ""}`;
}
function savCard(s, x){
  let badge, lines, prog = "";
  if (s.closed){
    badge = `<span class="badge done">Đã tất toán</span>`;
    lines = `<div class="row small"><span class="muted">Tất toán ${dmy(parse(s.closed.date))}</span><span class="num">Nhận ${money(s.closed.payout)}</span></div>
             <div class="row small"><span class="muted">Tổng tiền lãi</span><b class="num" style="color:var(--inc)">+${money(s.closed.interest)}</b></div>`;
  } else if (x.kind === "demand"){
    badge = `<span class="badge">Không kỳ hạn</span>`;
    lines = `<div class="row small"><span class="muted">Lãi tạm tính đến hôm nay (${x.days} ngày)</span><b class="num" style="color:var(--inc)">+${money(x.accrued)}</b></div>`;
  } else if (x.kind === "matured"){
    badge = `<span class="badge warn2">Đã đến hạn</span>`;
    lines = `<div class="row small"><span class="muted">Đến hạn ${dmy(parse(x.cycle.end))}, chờ tất toán</span><b class="num">${money(x.payout)}</b></div>`;
  } else {
    badge = `<span class="badge ${x.left <= 7 ? "warn2" : ""}">${x.left === 0 ? "Đến hạn hôm nay" : "Còn " + x.left + " ngày"}</span>`;
    prog = `<div class="prog"><span style="width:${Math.min(100, x.days / x.termDays * 100)}%"></span></div>`;
    lines = `<div class="row small"><span class="muted">Đến hạn ${dmy(parse(x.cycle.end))}${x.cycle.k > 1 ? `, kỳ thứ ${x.cycle.k}` : ""}</span><span class="num">Lãi tạm tính +${short(x.accrued)}</span></div>
             <div class="row small"><span class="muted">Lãi khi đến hạn</span><b class="num" style="color:var(--inc)">+${money(x.atMaturity)}</b></div>`;
  }
  const amt = s.closed ? s.principal : x.P;
  return `<button class="savc" data-sid="${esc(s.id)}">
    <div class="top"><div><div class="nm">${esc(savName(s))}</div><div class="bk">${esc([s.name ? s.bank : "", fmtRate(s.rate), termName(s.term), s.term ? (s.pay === "monthly" ? "lãi hàng tháng" : "lãi cuối kỳ") : ""].filter(Boolean).join(", "))}</div></div>${badge}</div>
    <div class="amt2 num">${money(amt)}</div>${prog}${lines}</button>`;
}

function syncSavForm(){

function readSavForm(){
  const P = parseAmount($("#sAmt").value), rate = parseRate($("#sRate").value), nt = parseRate($("#sNt").value.trim() || "0");
  const term = Number($("#sTerm").value), start = $("#sStart").value;
  let err = "";
  if (Number.isNaN(P) || P > 1e14) err = "Số tiền quá lớn.";
  else if (!P) err = "Nhập số tiền gửi.";
  else if (Number.isNaN(rate) || rate > 10000) err = "Lãi suất chưa đúng. Ví dụ: 5,5";
  else if (Number.isNaN(nt) || nt > 10000) err = "Lãi suất rút trước hạn chưa đúng. Ví dụ: 0,1";
  else if (!isYmd(start)) err = "Chọn ngày gửi.";
  if (err) return {err, s:null};
  const s = cleanSav("tmp", {name:$("#sName").value.trim(), bank:$("#sBank").value.trim(), principal:P, rate, term, start,
    pay:$("#sPay").value, roll:$("#sRoll").value, ntRate:nt, member:$("#sMem") ? $("#sMem").value : "", note:$("#sNote").value.trim()});
  return s ? {err:"", s} : {err:"Thông tin chưa hợp lệ.", s:null};

function prow(k, v, strong){ return `<div class="row"><span class="muted">${k}</span>${strong ? `<b class="num">${v}</b>` : `<span class="num">${v}</span>`}</div>`; }
function savPreview(){

/* ---------- Gold (vàng) ---------- */
const GTYPES = {nhan:"Nhẫn tròn trơn", mieng:"Vàng miếng", trangsuc:"Trang sức", khac:"Vàng khác"};
const GICON = {nhan:"💍", mieng:"🥇", trangsuc:"📿", khac:"🟡"};
const GT_KEYS = Object.keys(GTYPES);
/* 1 lượng (cây) = 10 chỉ = 100 phân = 1000 ly; 1 chỉ = 3,75 g. Khối lượng lưu bằng số nguyên "ly". */
const UNIT_LY = {luong:1000, chi:100, phan:10, ly:1};
const UNIT_NAME = {luong:"lượng", chi:"chỉ", phan:"phân", ly:"ly"};
const mulDiv = (a, b, c) => { const n = BigInt(a) * BigInt(b), d = BigInt(c); return Number((n * 2n + d) / (2n * d)); };
function fmtWeight(ly){
  if (!ly) return "0 chỉ";
  let r = Math.abs(ly); const parts = [];
  for (const u of ["luong","chi","phan","ly"]){ const q = Math.floor(r / UNIT_LY[u]); r -= q * UNIT_LY[u]; if (q) parts.push(q + " " + UNIT_NAME[u]); }
  return (ly < 0 ? "−" : "") + parts.join(" ");
}
const chiStr = ly => NF.format(ly / 100) + " chỉ";
const grams = ly => NF.format(Math.round(ly * 3.75) / 100) + " g";
function parseWeight(v, unit){
  const t = String(v).trim().replace(",", ".");
  if (!/^\d{1,6}(\.\d{1,3})?$/.test(t)) return NaN;
  const [i, f = ""] = t.split(".");
  const ly = Number(i + f) * UNIT_LY[unit] / 10 ** f.length;
  return Number.isInteger(ly) ? ly : NaN;
}
const perChi = (price, pUnit) => mulDiv(price, 100, UNIT_LY[pUnit]);
function cleanGold(id, d){
  if (!d || (d.side !== "buy" && d.side !== "sell") || !GTYPES[d.gtype] || !isYmd(d.date)) return null;
  if (!Number.isSafeInteger(d.weight) || d.weight <= 0 || d.weight > 1e8) return null;
  if (!Number.isSafeInteger(d.price) || d.price < 0 || d.price > 1e12 || !UNIT_LY[d.pUnit] || (d.pUnit !== "chi" && d.pUnit !== "luong")) return null;
  if (!Number.isSafeInteger(d.total) || d.total <= 0 || d.total > 1e14) return null;
  return {id, side:d.side, gtype:d.gtype, brand:String(d.brand||"").slice(0,40), weight:d.weight, price:d.price, pUnit:d.pUnit, total:d.total,
          date:d.date, note:String(d.note||"").slice(0,140), member:String(d.member||"").slice(0,40), createdAt:Number(d.createdAt)||0};
}
/* Sổ vàng theo phương pháp giá vốn bình quân, tính riêng từng loại vàng */
function goldBook(list = S.golds){
  const st = {}; for (const k of GT_KEYS) st[k] = {w:0, cost:0, realized:0, bought:0, sold:0, n:0};
  const ops = list.slice().sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.createdAt - b.createdAt);
  const res = new Map();
  for (const g of ops){
    const s = st[g.gtype]; s.n++;
    if (g.side === "buy"){ s.w += g.weight; s.cost += g.total; s.bought += g.weight; }
    else {
      const take = Math.min(g.weight, s.w), costOut = s.w ? mulDiv(s.cost, take, s.w) : 0;
      s.cost -= costOut; s.w -= take; s.sold += g.weight;
      const gain = g.total - costOut; s.realized += gain;
      res.set(g.id, {costOut, gain, over: g.weight > take});
    }
  }
  return {st, res};
}
const goldValue = (k, w) => { const p = (S.config.goldPrices || {})[k]; return p ? mulDiv(p.price, w, UNIT_LY[p.pUnit]) : null; };
function assetSeg(){
  return `<div class="seg" style="margin-top:12px">${[["savings","🏦 Tiết kiệm"],["gold","🟡 Vàng"],["real","🏠 Nhà đất"]].map(([k,l]) => `<button data-at="${k}" aria-pressed="${S.assetTab === k}">${l}</button>`).join("")}</div>`;
}
function goldChart(list){
  const pts = list.slice().sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.createdAt - b.createdAt).map(g => ({d:g.date, v:perChi(g.price, g.pUnit), side:g.side})).filter(p => p.v > 0);
  if (pts.length < 2) return `<div class="muted small">Cần ít nhất 2 lần mua bán có đơn giá để vẽ biểu đồ.</div>`;
  const W = 340, H = 150, pl = 44, pb = 22, pt = 10;
  const t0 = parse(pts[0].d).getTime(), t1 = parse(pts[pts.length-1].d).getTime() || t0 + 1;
  const vmin = Math.min(...pts.map(p => p.v)), vmax = Math.max(...pts.map(p => p.v)), pad = (vmax - vmin) * 0.1 || vmax * 0.05;
  const lo = vmin - pad, hi = vmax + pad;
  const x = d => pl + (W - pl - 8) * (t1 === t0 ? 0.5 : (parse(d).getTime() - t0) / (t1 - t0));
  const y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
  let g = "";
  for (let i = 0; i <= 2; i++){ const v = lo + (hi - lo) * i / 2; g += `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-5}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${esc(short(Math.round(v)))}</text>`; }
  g += `<polyline fill="none" stroke="var(--gold)" stroke-width="2" points="${pts.map(p => x(p.d) + "," + y(p.v)).join(" ")}"/>`;
  for (const p of pts) g += `<circle cx="${x(p.d)}" cy="${y(p.v)}" r="4" fill="${p.side === "buy" ? "var(--inc)" : "var(--exp)"}"><title>${dmy(parse(p.d))}: ${money(p.v)}/chỉ</title></circle>`;
  g += `<text x="${pl}" y="${H-5}" font-size="10" fill="var(--muted)">${dmy(parse(pts[0].d))}</text><text x="${W}" y="${H-5}" text-anchor="end" font-size="10" fill="var(--muted)">${dmy(parse(pts[pts.length-1].d))}</text>`;
  return `<div class="legend" style="opacity:1;margin-bottom:6px"><span><i style="background:var(--inc)"></i>Mua</span><span><i style="background:var(--exp)"></i>Bán</span><span class="muted">Đơn giá quy ra mỗi chỉ</span></div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Biểu đồ giá vàng theo thời gian">${g}</svg>`;
}
function renderGold(){
  const {st, res} = goldBook(), P = S.config.goldPrices || {};
  let tw = 0, tc = 0, tv = 0, priced = true, realized = 0;
  for (const k of GT_KEYS){ const s = st[k]; tw += s.w; tc += s.cost; realized += s.realized; if (s.w){ const v = goldValue(k, s.w); if (v === null) priced = false; else tv += v; } }
  const pl = tv - tc;
  const cards = GT_KEYS.filter(k => st[k].n).map(k => {
    const s = st[k], p = P[k], v = s.w ? goldValue(k, s.w) : null, avg = s.w ? mulDiv(s.cost, 100, s.w) : 0, d = v === null ? null : v - s.cost;
    return `<div class="card">
      <div class="row"><h2 style="margin:0">${GICON[k]} ${GTYPES[k]}</h2><b class="num">${esc(fmtWeight(s.w))}</b></div>
      <div class="muted small" style="margin-bottom:6px">${s.w ? `${chiStr(s.w)}, khoảng ${grams(s.w)}` : "Đã bán hết"}</div>
      ${s.w ? prow("Giá vốn bình quân", money(avg) + "/chỉ") + prow("Tổng giá vốn", money(s.cost)) : ""}
      ${p ? prow(`Giá bán ra hiện tại (${dmy(parse(p.date))})`, money(perChi(p.price, p.pUnit)) + "/chỉ") : (s.w ? `<div class="note">Chưa có giá hiện tại. Bấm <b>Cập nhật giá</b> để xem lãi lỗ.</div>` : "")}
      ${v !== null && s.w ? prow("Giá trị theo giá hiện tại", money(v), true) + prow("Lãi/lỗ tạm tính", `<span style="color:${d >= 0 ? "var(--inc)" : "var(--exp)"}">${signed(d)}${s.cost ? ` (${NF.format(Math.round(d / s.cost * 1000) / 10)}%)` : ""}</span>`, true) : ""}
      ${s.sold ? prow("Lãi/lỗ đã chốt khi bán", `<span style="color:${s.realized >= 0 ? "var(--inc)" : "var(--exp)"}">${signed(s.realized)}</span>`) : ""}
    </div>`;
  }).join("");
  let hist = S.golds.slice().sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.createdAt - a.createdAt);
  if (S.goldFilter !== "all") hist = hist.filter(g => g.gtype === S.goldFilter);
  const rows = hist.map(g => {
    const r = res.get(g.id);
    const extra = g.side === "sell" && r ? `<span class="s" style="display:block;color:${r.gain >= 0 ? "var(--inc)" : "var(--exp)"}">${r.gain >= 0 ? "Lãi" : "Lỗ"} ${money(Math.abs(r.gain))}${r.over ? ", bán nhiều hơn số đang giữ" : ""}</span>` : "";
    return `<button class="tx goldrow" data-gid="${esc(g.id)}"><span class="ic">${GICON[g.gtype]}</span>
      <span class="mid"><span class="t" style="display:block">${g.side === "buy" ? "Mua" : "Bán"} ${esc(fmtWeight(g.weight))} ${esc(GTYPES[g.gtype].toLowerCase())}${g.brand ? " " + esc(g.brand) : ""}</span>
      <span class="s" style="display:block">${dmy(parse(g.date))}, ${g.price ? money(perChi(g.price, g.pUnit)) + "/chỉ" : "không ghi đơn giá"}${g.note ? ", " + esc(g.note) : ""}</span>${extra}</span>
      <span class="amt num" style="color:${g.side === "buy" ? "var(--exp)" : "var(--inc)"}">${g.side === "buy" ? "−" : "+"}${NF.format(g.total)}</span></button>`;
  }).join("");
  $("#v-savings").innerHTML = assetSeg() + `
    <div class="card hero" style="background:var(--gold)">
      <div class="k">Vàng đang giữ</div>
      <div class="big num">${esc(fmtWeight(tw))}</div>
      <div class="rate">${tw ? `${chiStr(tw)}, khoảng ${grams(tw)}` : "Chưa có vàng"}</div>
      <div class="legend" style="margin-top:10px">
        <span>Giá vốn ${short(tc)}</span>
        ${tw && priced ? `<span>Giá trị hiện tại ${short(tv)}</span><span>${pl >= 0 ? "Lãi" : "Lỗ"} tạm tính ${short(Math.abs(pl))}</span>` : tw ? `<span>Cập nhật giá để xem giá trị</span>` : ""}
        ${realized ? `<span>Đã chốt ${realized >= 0 ? "lãi" : "lỗ"} ${short(Math.abs(realized))}</span>` : ""}
      </div>

async function saveGold(){
  const r = readGold(), err = m => { $("#gErr").textContent = m; };
  if (Number.isNaN(r.w) || !r.w) return err("Nhập khối lượng, ví dụ 1 chỉ hoặc 5 phân.");
  if (Number.isNaN(r.price)) return err("Đơn giá quá lớn.");
  if (Number.isNaN(r.total) || !r.total) return err("Nhập thành tiền hoặc đơn giá.");
  if (!isYmd($("#gD").value)) return err("Chọn ngày.");
  const others = S.golds.filter(x => !GF.editing || x.id !== GF.editing.id);
  if (GF.side === "sell"){ const held = goldBook(others).st[GF.gtype].w; if (r.w > held) return err(`Chỉ đang giữ ${fmtWeight(held)} ${GTYPES[GF.gtype].toLowerCase()}.`); }
  const rec = cleanGold(GF.editing ? GF.editing.id : newId(), {side:GF.side, gtype:GF.gtype, brand:$("#gBrand").value.trim(), weight:r.w, price:r.price, pUnit:r.pUnit,
    total:r.total, date:$("#gD").value, note:$("#gN").value.trim(), member:$("#gM") ? $("#gM").value : "", createdAt: GF.editing ? GF.editing.createdAt : Date.now()});
  if (!rec) return err("Thông tin chưa hợp lệ.");
  const log = !GF.editing && $("#gLog") && $("#gLog").checked;
  $("#gSave").disabled = true;
  try {
    await writeGold(rec);
    if (log){
      const label = `${fmtWeight(rec.weight)} ${GTYPES[rec.gtype].toLowerCase()}${rec.brand ? " " + rec.brand : ""}`;
      const base = {cat:pickCat("invest","vang"), date:rec.date, member:rec.member, sav:""};
      if (rec.side === "buy") await writeTx({...base, id:newId(), type:"invest", amount:rec.total, note:("Mua " + label).slice(0,140), createdAt:Date.now(), wd:false});
      else {
        const x = goldBook([...others, rec]).res.get(rec.id), costOut = x ? x.costOut : rec.total, gain = rec.total - costOut;
        if (costOut > 0) await writeTx({...base, id:newId(), type:"invest", amount:costOut, note:("Bán " + label + ", thu hồi vốn").slice(0,140), createdAt:Date.now(), wd:true});
        if (gain > 0) await writeTx({...base, id:newId(), type:"income", cat:pickCat("income","laidt"), amount:gain, note:("Lãi bán " + label).slice(0,140), createdAt:Date.now()+1, wd:false});
        if (gain < 0) await writeTx({...base, id:newId(), type:"expense", cat:pickCat("expense","chikhac"), amount:-gain, note:("Lỗ bán " + label).slice(0,140), createdAt:Date.now()+1, wd:false});
      }
    }
    closeSheet(); toast(GF.editing ? "Đã lưu thay đổi" : "Đã lưu giao dịch vàng");
  } catch(e){ err(e && e.code === "invalid_argument" ? "Bạn chỉ có quyền xem, không thể ghi." : "Chưa lưu được. Thử lại."); $("#gSave").disabled = false; }
}

/* ---------- Real estate (nhà đất) ---------- */
const RTYPES = {datO:"Đất ở", datNN:"Đất nông nghiệp", nha:"Nhà riêng", canho:"Căn hộ", khac:"Nhà đất khác"};
const RICON = {datO:"🏡", datNN:"🌾", nha:"🏠", canho:"🏢", khac:"🏬"};
/* Diện tích lưu bằng số nguyên = m² × 100 (chính xác đến 0,01 m²) */
const areaStr = a => NF.format(a / 100) + " m²";
function parseArea(v){
  const t = String(v).trim().replace(",", ".");
  if (!/^\d{1,9}(\.\d{1,2})?$/.test(t)) return NaN;
  const [i, f = ""] = t.split(".");
  return Number(i + f.padEnd(2, "0"));
}
const areaInput = a => String(a / 100).replace(".", ",");
function cleanReal(id, d){
  if (!d || !RTYPES[d.rtype] || !isYmd(d.buyDate)) return null;
  const ok = (v, max) => Number.isSafeInteger(v) && v >= 0 && v <= max;
  const fees = d.fees || 0;
  if (!ok(d.area, 1e12) || d.area <= 0 || !ok(d.buyTotal, 1e15) || d.buyTotal <= 0 || !ok(fees, 1e15)) return null;
  const vals = (Array.isArray(d.vals) ? d.vals : []).filter(v => v && isYmd(v.date) && ok(v.perM2, 1e13) && v.perM2 > 0)
    .map(v => ({date:v.date, perM2:v.perM2})).sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0).slice(-100);
  const sold = d.sold && isYmd(d.sold.date) && ok(d.sold.total, 1e15) && d.sold.total > 0 ? {date:d.sold.date, total:d.sold.total} : null;
  return {id, name:String(d.name||"").slice(0,60), rtype:d.rtype, addr:String(d.addr||"").slice(0,120), area:d.area, buyDate:d.buyDate,
          buyTotal:d.buyTotal, fees, vals, sold, member:String(d.member||"").slice(0,40), note:String(d.note||"").slice(0,140), createdAt:Number(d.createdAt)||0};
}
const realName = r => r.name || RTYPES[r.rtype];
const buyPerM2 = r => mulDiv(r.buyTotal, 100, r.area);
function realState(r){
  const last = r.vals[r.vals.length - 1] || null, cost = r.buyTotal + r.fees;
  const value = last ? mulDiv(last.perM2, r.area, 100) : null;
  return {last, cost, value, gain: value === null ? null : value - cost};
}
const pct = (a, b) => b ? ` (${a >= 0 ? "+" : "−"}${NF.format(Math.abs(Math.round(a / b * 1000) / 10))}%)` : "";
const gainSpan = (g, base) => `<span style="color:${g >= 0 ? "var(--inc)" : "var(--exp)"}">${signed(g)}${pct(g, base)}</span>`;
function lineChart(pts, unit){
  if (pts.length < 2) return `<div class="muted small">Thêm giá hiện tại ở các thời điểm khác nhau để xem biểu đồ.</div>`;
  const W = 340, H = 150, pl = 44, pb = 22, pt = 10;
  const t0 = parse(pts[0].d).getTime(), t1 = parse(pts[pts.length-1].d).getTime();
  const vmin = Math.min(...pts.map(p => p.v)), vmax = Math.max(...pts.map(p => p.v)), pad = (vmax - vmin) * 0.1 || vmax * 0.05;
  const lo = vmin - pad, hi = vmax + pad;
  const x = d => pl + (W - pl - 8) * (t1 === t0 ? 0.5 : (parse(d).getTime() - t0) / (t1 - t0));
  const y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
  const col = {buy:"var(--inc)", val:"var(--inv)", sell:"var(--exp)"};
  let g = "";
  for (let i = 0; i <= 2; i++){ const v = lo + (hi - lo) * i / 2; g += `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-5}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${esc(short(Math.round(v)))}</text>`; }
  g += `<polyline fill="none" stroke="var(--inv)" stroke-width="2" points="${pts.map(p => x(p.d) + "," + y(p.v)).join(" ")}"/>`;
  for (const p of pts) g += `<circle cx="${x(p.d)}" cy="${y(p.v)}" r="4" fill="${col[p.k]}"><title>${dmy(parse(p.d))}: ${money(p.v)}/${unit}</title></circle>`;
  g += `<text x="${pl}" y="${H-5}" font-size="10" fill="var(--muted)">${dmy(parse(pts[0].d))}</text><text x="${W}" y="${H-5}" text-anchor="end" font-size="10" fill="var(--muted)">${dmy(parse(pts[pts.length-1].d))}</text>`;
  return `<div class="legend" style="opacity:1;margin-bottom:6px"><span><i style="background:var(--inc)"></i>Giá mua</span><span><i style="background:var(--inv)"></i>Giá hiện tại</span>${pts.some(p => p.k === "sell") ? `<span><i style="background:var(--exp)"></i>Giá bán</span>` : ""}<span class="muted">mỗi ${unit}</span></div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Biểu đồ giá theo thời gian">${g}</svg>`;
}
function renderReal(){
  const own = S.reals.filter(r => !r.sold), sold = S.reals.filter(r => r.sold);
  let cost = 0, value = 0, unpriced = 0, area = 0;
  for (const r of own){ const x = realState(r); cost += x.cost; area += r.area; if (x.value === null){ unpriced++; value += x.cost; } else value += x.value; }
  const realized = sold.reduce((a, r) => a + r.sold.total - (r.buyTotal + r.fees), 0);
  own.sort((a,b) => a.buyDate < b.buyDate ? -1 : 1); sold.sort((a,b) => a.sold.date < b.sold.date ? 1 : -1);
  $("#v-savings").innerHTML = assetSeg() + `
    <div class="card hero" style="background:var(--inv)">
      <div class="k">Nhà đất đang sở hữu (${own.length})</div>
      <div class="big num">${money(value)}</div>
      <div class="rate">Giá trị theo giá hiện tại${unpriced ? `, ${unpriced} tài sản chưa có giá hiện tại nên tạm tính theo giá mua` : ""}</div>
      <div class="legend" style="margin-top:10px">
        <span>Giá vốn ${short(cost)}</span>
        <span>${value - cost >= 0 ? "Lãi" : "Lỗ"} tạm tính ${short(Math.abs(value - cost))}</span>
        ${area ? `<span>Tổng diện tích ${areaStr(area)}</span>` : ""}
        ${sold.length ? `<span>Đã chốt ${realized >= 0 ? "lãi" : "lỗ"} ${short(Math.abs(realized))}</span>` : ""}
      </div>
    </div>
    <button class="btn" data-re-new>+ Thêm nhà, đất</button>
    ${own.length ? own.map(realCard).join("") : `<div class="empty">Chưa có nhà đất nào. Bấm <b>+ Thêm nhà, đất</b> để ghi diện tích, giá mua và giá hiện tại trên m².</div>`}
    ${sold.length ? `<h2 style="margin:22px 4px 0">Đã bán</h2>${sold.map(realCard).join("")}` : ""}`;
}
function realCard(r){
  const x = realState(r);
  let body;
  if (r.sold){
    const g = r.sold.total - x.cost;
    body = prow(`Bán ${dmy(parse(r.sold.date))}`, money(r.sold.total)) + prow("Giá bán mỗi m²", money(mulDiv(r.sold.total, 100, r.area))) + prow(g >= 0 ? "Lãi" : "Lỗ", gainSpan(g, x.cost), true);
  } else {
    body = prow(`Mua ${dmy(parse(r.buyDate))}`, money(buyPerM2(r)) + "/m²")
      + (x.last ? prow(`Hiện tại (${dmy(parse(x.last.date))})`, money(x.last.perM2) + "/m²") + prow("Giá trị", money(x.value), true) + prow("Lãi/lỗ tạm tính", gainSpan(x.gain, x.cost), true)
                : prow("Giá vốn", money(x.cost), true) + `<div class="note">Chưa có giá hiện tại. Bấm để cập nhật.</div>`);
  }
  return `<button class="savc recard" data-rid="${esc(r.id)}">
    <div class="top"><div><div class="nm">${RICON[r.rtype]} ${esc(realName(r))}</div><div class="bk">${esc([r.name ? RTYPES[r.rtype] : "", areaStr(r.area), r.addr].filter(Boolean).join(", "))}</div></div>${r.sold ? `<span class="badge done">Đã bán</span>` : ""}</div>
    <div style="margin-top:6px">${body}</div></button>`;
}

/* Sheet: thêm / sửa nhà đất */
const RF = {editing:null, cur:null, rtype:"datO", last:"per"};
function openReal(r){
  RF.editing = r || null; RF.cur = null; RF.rtype = r ? r.rtype : "datO"; RF.last = "tot";
  SV.cur = null; SV.editing = null; GF.editing = null;

  showSsheet(`<div class="grab"></div>

    <div class="field"><span>Loại</span><div class="cats" id="rTypes" style="grid-template-columns:repeat(5,1fr)">${Object.keys(RTYPES).map(k => `<button class="cat" data-rty="${k}" style="--tc:var(--inv)"><span class="e">${RICON[k]}</span>${RTYPES[k]}</button>`).join("")}</div></div>

    </div>

      <div class="field"><span>Giá mua mỗi m²</span><input type="text" class="num" id="rPer" inputmode="numeric" autocomplete="off" placeholder="0" value="${r ? NF.format(buyPerM2(r)) : ""}"></div>
      <div class="field"><span>Tổng giá mua</span><input type="text" class="num" id="rTot" inputmode="numeric" autocomplete="off" placeholder="0" value="${r ? NF.format(r.buyTotal) : ""}"></div>

    ${r ? "" : `<div class="field"><span>Giá hiện tại mỗi m² (nếu biết)</span><input type="text" class="num" id="rNow" inputmode="numeric" autocomplete="off" placeholder="Bỏ trống nếu chưa biết"></div>`}
    <div class="two">
      ${mem.length ? `<div class="field"><span>Người đứng tên</span><select id="rMem"><option value="">Không ghi</option>${mem.map(m => `<option ${r && r.member === m ? "selected" : ""}>${esc(m)}</option>`).join("")}</select></div>` : ""}
      <div class="field" ${mem.length ? "" : `style="grid-column:1/-1"`}><span>Ghi chú</span><input type="text" id="rNote" maxlength="140" value="${esc(r ? r.note : "")}"></div>
    </div>
    ${r ? "" : `<label class="check"><input type="checkbox" id="rLog" checked><span>Ghi vào sổ thu chi: khoản đầu tư bất động sản (giá mua và chi phí)</span></label>`}
    <div class="preview" id="rPrev"></div>
    <div class="err" id="rErr" role="alert"></div>
    <button class="btn" id="rSave">${r ? "Lưu thay đổi" : "Lưu"}</button>`);
  drawRealForm(); realPreview();
}
function drawRealForm(){ document.querySelectorAll("#rTypes .cat").forEach(b => b.setAttribute("aria-pressed", b.dataset.rty === RF.rtype)); }
function linkPrice(){
  const area = parseArea($("#rArea").value);
  if (Number.isNaN(area) || !area) return;
  if (RF.last === "per"){ const p = parseAmount($("#rPer").value); if (p && !Number.isNaN(p)) $("#rTot").value = NF.format(mulDiv(p, area, 100)); }
  else { const t = parseAmount($("#rTot").value); if (t && !Number.isNaN(t)) $("#rPer").value = NF.format(mulDiv(t, 100, area)); }
}
function readReal(){
  const area = parseArea($("#rArea").value), tot = parseAmount($("#rTot").value), fees = parseAmount($("#rFees").value) || 0, now = $("#rNow") ? parseAmount($("#rNow").value) : 0;
  return {area, tot, fees, now};
}
function realPreview(){
  const r = readReal(), el = $("#rPrev");
  if (Number.isNaN(r.area) || !r.area || Number.isNaN(r.tot) || !r.tot || Number.isNaN(r.fees)){ el.innerHTML = `<div class="muted small">Nhập diện tích và giá mua (mỗi m² hoặc tổng) để xem giá vốn.</div>`; return; }
  const cost = r.tot + r.fees;
  let h = prow("Giá vốn (giá mua + chi phí)", money(cost), true) + prow("Giá vốn mỗi m²", money(mulDiv(cost, 100, r.area)));
  if (r.now && !Number.isNaN(r.now)){ const v = mulDiv(r.now, r.area, 100); h += prow("Giá trị hiện tại", money(v), true) + prow("Lãi/lỗ tạm tính", gainSpan(v - cost, cost), true); }
  el.innerHTML = h;
}
async function saveReal(){
  const r = readReal(), err = m => { $("#rErr").textContent = m; };
  if (Number.isNaN(r.area) || !r.area) return err("Nhập diện tích, ví dụ 85,5");
  if (Number.isNaN(r.tot) || !r.tot) return err("Nhập giá mua mỗi m² hoặc tổng giá mua.");
  if (Number.isNaN(r.fees) || Number.isNaN(r.now)) return err("Số tiền quá lớn.");
  if (!isYmd($("#rDate").value)) return err("Chọn ngày mua.");
  const ed = RF.editing;
  const vals = ed ? ed.vals : (r.now ? [{date:ymd(new Date()), perM2:r.now}] : []);
  const obj = cleanReal(ed ? ed.id : newId(), {name:$("#rName").value.trim(), rtype:RF.rtype, addr:$("#rAddr").value.trim(), area:r.area, buyDate:$("#rDate").value,
    buyTotal:r.tot, fees:r.fees, vals, sold: ed ? ed.sold : null, member:$("#rMem") ? $("#rMem").value : "", note:$("#rNote").value.trim(), createdAt: ed ? ed.createdAt : Date.now()});
  if (!obj) return err("Thông tin chưa hợp lệ.");
  const log = !ed && $("#rLog") && $("#rLog").checked;
  $("#rSave").disabled = true;
  try {
    await writeReal(obj);
    if (log) await writeTx({id:newId(), type:"invest", amount:obj.buyTotal + obj.fees, cat:pickCat("invest","bds"), date:obj.buyDate, note:("Mua " + realName(obj)).slice(0,140), member:obj.member, createdAt:Date.now(), wd:false, sav:""});
    closeSheet(); toast(ed ? "Đã lưu thay đổi" : "Đã thêm nhà đất");
  } catch(e){ err(e && e.code === "invalid_argument" ? "Bạn chỉ có quyền xem, không thể ghi." : "Chưa lưu được. Thử lại."); $("#rSave").disabled = false; }
}

/* Sheet: chi tiết, định giá, bán */
function openRealDetail(r){
  RF.cur = r; RF.editing = null; SV.cur = null; SV.editing = null; GF.editing = null;
  const x = realState(r), today = ymd(new Date());
  const pts = [{d:r.buyDate, v:buyPerM2(r), k:"buy"}, ...r.vals.map(v => ({d:v.date, v:v.perM2, k:"val"}))];
  if (r.sold) pts.push({d:r.sold.date, v:mulDiv(r.sold.total, 100, r.area), k:"sell"});
  pts.sort((a,b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0);
  const valRows = r.vals.slice().reverse().map(v => {
    const val = mulDiv(v.perM2, r.area, 100);
    return `<tr><td>${dmy(parse(v.date))}</td><td class="num">${NF.format(v.perM2)}</td><td class="num">${NF.format(val)}</td><td class="num">${gainSpan(val - x.cost, x.cost).replace(/ ₫/, "")}</td><td><button class="del" style="width:34px;height:34px" data-vdel="${esc(v.date)}" aria-label="Xóa giá ngày ${dmy(parse(v.date))}">✕</button></td></tr>`;
  }).join("");
  const sell = r.sold
    ? `<div class="preview">${prow("Ngày bán", dmy(parse(r.sold.date)))}${prow("Giá bán", money(r.sold.total), true)}${prow("Giá bán mỗi m²", money(mulDiv(r.sold.total, 100, r.area)))}${prow(r.sold.total - x.cost >= 0 ? "Lãi đã chốt" : "Lỗ đã chốt", gainSpan(r.sold.total - x.cost, x.cost), true)}</div>
       <button class="btn ghost" id="rUnsell" style="color:var(--ink)">Hủy ghi nhận đã bán</button>`
    : `<h2 style="margin-top:18px">Ghi nhận đã bán</h2>
       <div class="two"><div class="field"><span>Ngày bán</span><input type="date" id="rSD" value="${today}"></div>
       <div class="field"><span>Tổng giá bán (sau thuế, phí)</span><input type="text" class="num" id="rST" inputmode="numeric" autocomplete="off" placeholder="0"></div></div>
       <div class="preview" id="rSPrev"><div class="muted small">Nhập giá bán để xem lãi lỗ.</div></div>
       <label class="check"><input type="checkbox" id="rSLog" checked><span>Ghi vào sổ thu chi: thu hồi vốn và ghi lãi hoặc lỗ</span></label>
       <button class="btn" id="rSell" style="background:var(--surface2);color:var(--ink);border:1px solid var(--line)">Xác nhận đã bán</button>`;
  showSsheet(`<div class="grab"></div>
    <div class="row"><h2 style="margin:0">${RICON[r.rtype]} ${esc(realName(r))}</h2><button class="iconbtn" data-close aria-label="Đóng">✕</button></div>
    ${r.addr ? `<div class="muted small">${esc(r.addr)}</div>` : ""}
    <div class="preview">
      ${prow("Loại", RTYPES[r.rtype])}${prow("Diện tích", areaStr(r.area))}${prow("Ngày mua", dmy(parse(r.buyDate)))}
      ${prow("Giá mua mỗi m²", money(buyPerM2(r)))}${prow("Tổng giá mua", money(r.buyTotal))}
      ${r.fees ? prow("Chi phí khác", money(r.fees)) : ""}${prow("Giá vốn", money(x.cost), true)}
      ${!r.sold && x.last ? prow(`Giá trị hiện tại (${dmy(parse(x.last.date))})`, money(x.value), true) + prow("Lãi/lỗ tạm tính", gainSpan(x.gain, x.cost), true) : ""}
      ${r.member ? prow("Người đứng tên", esc(r.member)) : ""}${r.note ? prow("Ghi chú", esc(r.note)) : ""}
    </div>
    <div style="margin-top:14px">${lineChart(pts, "m²")}</div>
    ${r.sold ? "" : `<h2 style="margin-top:18px">Cập nhật giá hiện tại</h2>
      <div class="two"><div class="field"><span>Ngày</span><input type="date" id="rVD" value="${today}"></div>
      <div class="field"><span>Giá mỗi m²</span><input type="text" class="num" id="rVP" inputmode="numeric" autocomplete="off" placeholder="0"></div></div>
      <div class="note" id="rVHint">Giá trị = giá mỗi m² × ${areaStr(r.area)}</div>
      <button class="btn" id="rValAdd">Lưu giá</button>`}
    ${valRows ? `<h2 style="margin-top:18px">Lịch sử giá hiện tại</h2><div class="tablewrap"><table><thead><tr><th>Ngày</th><th>Giá/m²</th><th>Giá trị</th><th>So với vốn</th><th></th></tr></thead><tbody>${valRows}</tbody></table></div>` : ""}
    ${sell}
    <div class="err" id="rErr" role="alert"></div>
    <button class="btn" id="rEdit" style="background:var(--surface2);color:var(--ink);border:1px solid var(--line)">Sửa thông tin</button>
    <button class="btn ghost" id="rDel">Xóa nhà đất này</button>`);
}
const curReal = () => S.reals.find(v => v.id === RF.cur.id) || RF.cur;
async function realUpdate(obj, msg){
  try { await writeReal(obj); toast(msg); openRealDetail(obj); }
  catch(e){ $("#rErr").textContent = e && e.code === "invalid_argument" ? "Bạn chỉ có quyền xem, không thể ghi." : "Chưa lưu được. Thử lại."; }
}
$("#ssheet").addEventListener("click", async e => {
  const t = e.target;
  const ty = t.closest("[data-rty]"); if (ty){ RF.rtype = ty.dataset.rty; drawRealForm(); return; }
  if (t.id === "rSave") return saveReal();
  if (t.id === "rEdit") return openReal(curReal());
  if (t.id === "rValAdd"){
    const r = curReal(), d = $("#rVD").value, p = parseAmount($("#rVP").value);
    if (!isYmd(d)){ $("#rErr").textContent = "Chọn ngày."; return; }
    if (!p || Number.isNaN(p)){ $("#rErr").textContent = "Nhập giá mỗi m²."; return; }
    const vals = r.vals.filter(v => v.date !== d).concat([{date:d, perM2:p}]);
    return realUpdate(cleanReal(r.id, {...r, vals}), "Đã lưu giá");
  }
  const vd = t.closest("[data-vdel]"); if (vd){ const r = curReal(); return realUpdate(cleanReal(r.id, {...r, vals:r.vals.filter(v => v.date !== vd.dataset.vdel)}), "Đã xóa giá"); }
  if (t.id === "rSell"){
    const r = curReal(), d = $("#rSD").value, tot = parseAmount($("#rST").value);
    if (!isYmd(d) || d < r.buyDate){ $("#rErr").textContent = "Ngày bán chưa hợp lệ."; return; }
    if (!tot || Number.isNaN(tot)){ $("#rErr").textContent = "Nhập tổng giá bán."; return; }
    const obj = cleanReal(r.id, {...r, sold:{date:d, total:tot}}), cost = r.buyTotal + r.fees, gain = tot - cost;
    try {
      await writeReal(obj);
      if ($("#rSLog").checked){
        const base = {date:d, member:r.member, sav:"", wd:false}, nm = realName(r);
        await writeTx({...base, id:newId(), type:"invest", cat:pickCat("invest","bds"), amount:cost, note:("Bán " + nm + ", thu hồi vốn").slice(0,140), createdAt:Date.now(), wd:true});
        if (gain > 0) await writeTx({...base, id:newId(), type:"income", cat:pickCat("income","laidt"), amount:gain, note:("Lãi bán " + nm).slice(0,140), createdAt:Date.now()+1});
        if (gain < 0) await writeTx({...base, id:newId(), type:"expense", cat:pickCat("expense","chikhac"), amount:-gain, note:("Lỗ bán " + nm).slice(0,140), createdAt:Date.now()+1});
      }
      toast("Đã ghi nhận đã bán"); openRealDetail(obj);
    } catch(err){ $("#rErr").textContent = "Chưa lưu được. Thử lại."; }
    return;
  }
  if (t.id === "rUnsell"){ const r = curReal(); return realUpdate(cleanReal(r.id, {...r, sold:null}), "Đã hủy. Giao dịch trong sổ thu chi vẫn giữ nguyên."); }
  if (t.id === "rDel"){
    if (!t.dataset.armed){ t.dataset.armed = "1"; t.textContent = "Bấm lần nữa để xóa"; return; }
    try { await removeReal(RF.cur.id); closeSheet(); toast("Đã xóa. Giao dịch trong sổ thu chi vẫn giữ nguyên."); } catch(err){ toast("Chưa xóa được"); }
  }
});
$("#ssheet").addEventListener("input", e => {
  const id = e.target.id;
  if (["rPer","rTot","rFees","rNow","rVP","rST"].includes(id)){ const v = parseAmount(e.target.value); e.target.value = v ? NF.format(v) : ""; }
  if (id === "rPer") RF.last = "per";
  if (id === "rTot") RF.last = "tot";
  if (["rArea","rPer","rTot"].includes(id)) linkPrice();
  if ($("#rPrev")) realPreview();
  if (id === "rVP" && RF.cur){ const p = parseAmount(e.target.value); $("#rVHint").textContent = p && !Number.isNaN(p) ? `Giá trị: ${money(mulDiv(p, RF.cur.area, 100))}` : `Giá trị = giá mỗi m² × ${areaStr(RF.cur.area)}`; }
  if (id === "rST" && RF.cur){
    const r = curReal(), tot = parseAmount(e.target.value), cost = r.buyTotal + r.fees;
    $("#rSPrev").innerHTML = tot && !Number.isNaN(tot) ? prow("Giá bán mỗi m²", money(mulDiv(tot, 100, r.area))) + prow(tot - cost >= 0 ? "Lãi" : "Lỗ", gainSpan(tot - cost, cost), true) : `<div class="muted small">Nhập giá bán để xem lãi lỗ.</div>`;
  }
});

const F = {type:"expense", cat:"", editing:null};
function parseAmount(str){ const d = String(str).replace(/\D/g, "").replace(/^0+/, ""); if (!d) return 0; if (d.length > 15) return NaN; return Number(d); }
function fmtAmountInput(){ const el = $("#fAmount"), v = parseAmount(el.value); el.value = v ? NF.format(v) : ""; }
function drawCats(){
  const cats = S.config.categories[F.type];
  if (!cats.some(c => c.id === F.cat)) F.cat = cats[0] ? cats[0].id : "";
  $("#fCats").innerHTML = cats.map(c => `<button class="cat" data-c="${esc(c.id)}" aria-pressed="${c.id===F.cat}" style="--tc:${TYPES[F.type].color}"><span class="e">${esc(c.icon)}</span>${esc(c.name)}</button>`).join("");
  document.querySelectorAll("#fType button").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === F.type));
  const dirOn = F.type === "saving" || F.type === "invest", db2 = document.querySelectorAll("#fDir button");
  $("#fDir").classList.toggle("hidden", !dirOn);
  db2[0].textContent = F.type === "invest" ? "Mua, góp vốn" : "Gửi vào";
  db2[1].textContent = F.type === "invest" ? "Bán, rút vốn" : "Rút ra";
  db2.forEach(b => b.setAttribute("aria-pressed", (b.dataset.d === "out") === !!F.wd));
  $("#fGoldHint").classList.toggle("hidden", !(F.type === "invest" && F.cat === "vang" && !F.editing));
}
function openSheet(tx){
  F.editing = tx || null;
  F.type = tx ? tx.type : (S.view === "ledger" && S.ledgerType !== "all" ? S.ledgerType : "expense");
  F.cat = tx ? tx.cat : ""; F.wd = tx ? !!tx.wd : false;
  $("#sheetTitle").textContent = tx ? "Sửa giao dịch" : "Thêm giao dịch";
  $("#fAmount").value = tx ? NF.format(tx.amount) : "";
  const r = curRange(), today = ymd(new Date());
  $("#fDate").value = tx ? tx.date : (today >= r.from && today <= r.to ? today : r.to);
  $("#fNote").value = tx ? tx.note : "";
  const mem = S.config.members;
  $("#fMemberWrap").classList.toggle("hidden", !mem.length && !(tx && tx.member));
  const opts = mem.slice(); if (tx && tx.member && !opts.includes(tx.member)) opts.push(tx.member);
  $("#fMember").innerHTML = `<option value="">Không ghi</option>` + opts.map(m => `<option ${tx && tx.member===m?"selected":""}>${esc(m)}</option>`).join("");
  $("#fErr").textContent = "";
  $("#fSave").textContent = tx ? "Lưu thay đổi" : "Lưu giao dịch";
  $("#fDel").classList.toggle("hidden", !tx);
  $("#fDel").textContent = "Xóa giao dịch"; $("#fDel").dataset.armed = "";
  drawCats();
  $("#scrim").classList.add("on"); $("#sheet").classList.add("on");
  if (!tx) setTimeout(() => $("#fAmount").focus(), 230);
}
function closeSheet(){ $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on"); $("#ssheet").classList.remove("on"); }
async function submit(){
  const amount = parseAmount($("#fAmount").value), date = $("#fDate").value;
  const err = m => { $("#fErr").textContent = m; };
  if (Number.isNaN(amount) || amount > Number.MAX_SAFE_INTEGER) return err("Số tiền quá lớn.");
  if (!amount) return err("Nhập số tiền lớn hơn 0.");
  if (!F.cat) return err("Chọn một hạng mục.");
  if (!isYmd(date)) return err("Chọn ngày giao dịch.");
  const tx = {id: F.editing ? F.editing.id : newId(), type:F.type, amount, cat:F.cat, date,
              note:$("#fNote").value.trim().slice(0,140), member:$("#fMember").value, createdAt: F.editing ? F.editing.createdAt : Date.now(), wd:(F.type === "saving" || F.type === "invest") && !!F.wd, sav: F.editing ? (F.editing.sav || "") : ""};
  $("#fSave").disabled = true;
  try { await writeTx(tx); closeSheet(); toast(F.editing ? "Đã lưu thay đổi" : "Đã lưu giao dịch"); }
  catch(e){ err(e && e.code === "invalid_argument" ? "Bạn chỉ có quyền xem, không thể ghi." : "Chưa lưu được. Kiểm tra kết nối rồi thử lại."); }
  finally { $("#fSave").disabled = false; }
}

const BK_APP = "so-tai-chinh-gia-dinh", LAST_BK = "so-tai-chinh-last-backup";
const BK = {file:null, busy:false, msg:null};
const goodId = id => typeof id === "string" && /^[A-Za-z0-9_-]{1,100}$/.test(id);
function lastBackup(){ try { return localStorage.getItem(LAST_BK) || ""; } catch(e){ return ""; } }
function bkMsg(text, ok){ BK.msg = text ? {text, ok:!!ok} : null; render(); }
async function saveFile(filename, data, mime){
  let dl = null;
  try { if (window.claude && window.claude.use) dl = await window.claude.use("downloads"); } catch(e){}
  if (dl){
    try { const r = await dl.save({filename, data}); return r && r.status !== "cancelled" ? true : r ? true : false; }
    catch(e){ if (e && e.code === "host_unavailable") throw new Error("App Claude trên máy này chưa lưu được file. Hãy mở trang bằng trình duyệt hoặc máy tính."); if (e && e.code === "declined") return false; throw new Error("Chưa tải được file."); }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], {type:mime}));
  a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  return true;
}
async function makeBackup(pw){
  const data = {txs:S.txs, savs:S.savs, golds:S.golds, reals:S.reals, config:S.config};
  const meta = {app:BK_APP, v:1, exportedAt:new Date().toISOString(), counts:{txs:data.txs.length, savs:data.savs.length, golds:data.golds.length, reals:data.reals.length}};
  if (!pw) return JSON.stringify({...meta, data});
  const salt = crypto.getRandomValues(new Uint8Array(16)), key = await deriveKek(pw, salt, ITER);
  return JSON.stringify({...meta, enc:{salt:b64(salt), iter:ITER, data: await encObj(key, data)}});
}
async function doBackup(){
  if (BK.busy) return;

    else bkMsg("Bạn đã hủy tải file.");
  } catch(e){ BK.busy = false; bkMsg(e && e.message ? e.message : "Chưa tạo được file sao lưu."); }

async function readBackup(text, pw){
  let j; try { j = JSON.parse(text); } catch(e){ throw new Error("File không đúng định dạng sao lưu."); }
  if (!j || j.app !== BK_APP) throw new Error("Đây không phải file sao lưu của Sổ tài chính gia đình.");
  let data = j.data;
  if (j.enc){
    if (!CRYPTO_OK) throw new Error("Trình duyệt này không giải mã được file.");
    if (!pw) throw new Error("File có mật khẩu. Nhập mật khẩu file rồi bấm lại.");
    const iter = Number(j.enc.iter);
    if (!Number.isInteger(iter) || iter < 100000 || iter > 5000000) throw new Error("File sao lưu bị hỏng.");
    try { data = await decObj(await deriveKek(pw, unb64(String(j.enc.salt)), iter), String(j.enc.data)); }
    catch(e){ throw new Error("Mật khẩu file sao lưu không đúng."); }
  }
  if (!data || typeof data !== "object") throw new Error("File sao lưu bị hỏng.");
  const pick = (arr, clean) => (Array.isArray(arr) ? arr : []).map(x => x && clean(goodId(x.id) ? x.id : newId(), x)).filter(Boolean);
  return {txs:pick(data.txs, cleanTx), savs:pick(data.savs, cleanSav), golds:pick(data.golds, cleanGold), reals:pick(data.reals, cleanReal),
          config:cleanConfig(data.config), exportedAt:String(j.exportedAt || "")};
}
function mergeConfig(a, b){
  const out = JSON.parse(JSON.stringify(a));
  for (const t of TYPE_KEYS) for (const c of b.categories[t]) if (!out.categories[t].some(x => x.id === c.id)) out.categories[t].push(c);
  for (const m of b.members) if (!out.members.includes(m)) out.members.push(m);
  for (const k in b.goldPrices) if (!out.goldPrices[k] || out.goldPrices[k].date < b.goldPrices[k].date) out.goldPrices[k] = b.goldPrices[k];
  return out;
}
const COLLS = [["txs","tx"],["savs","sav"],["golds","gold"],["reals","real"]];
async function doRestore(){
  if (BK.busy) return;
  if (!BK.file) return bkMsg("Chọn file sao lưu (.json) trước.");
  const mode = ($("#bkMode") || {}).value || "merge", btn = $("#bkRestore");
  if (mode === "replace" && !btn.dataset.armed){ btn.dataset.armed = "1"; btn.textContent = "Bấm lần nữa: xóa dữ liệu hiện tại và thay bằng file"; return; }
  BK.busy = true; bkMsg("Đang đọc file…", true);
  try {
    const d = await readBackup(await BK.file.text(), ($("#bkPwR") || {}).value || "");
    const total = COLLS.reduce((a,[k]) => a + d[k].length, 0);
    if (S.store === "db"){
      let n = 0;
      for (const [k, coll] of COLLS){
        const have = new Set(S[k].map(x => x.id));
        const list = mode === "replace" ? d[k] : d[k].filter(x => !have.has(x.id));
        for (const item of list){
          if (n % 10 === 0) bkMsg(`Đang khôi phục ${n}/${total}…`, true);
          const body = await txBody(item);
          await withRetry(() => db.collection(coll).doc(item.id).set(body)); n++;
        }
        if (mode === "replace"){
          const keep = new Set(d[k].map(x => x.id));
          for (const old of S[k].slice()) if (!keep.has(old.id)) await withRetry(() => db.collection(coll).doc(old.id).delete());
        }
      }
      S.config = mode === "replace" ? d.config : mergeConfig(S.config, d.config);
      await saveConfig();
    } else {
      for (const [k] of COLLS){
        if (mode === "replace") S[k] = d[k];
        else { const have = new Set(S[k].map(x => x.id)); S[k] = S[k].concat(d[k].filter(x => !have.has(x.id))); }
      }
      S.config = mode === "replace" ? d.config : mergeConfig(S.config, d.config);
      await saveLocal();
    }
    BK.busy = false; BK.file = null;
    const when = d.exportedAt ? ` (sao lưu ngày ${dmy(new Date(d.exportedAt))})` : "";
    bkMsg(`Đã khôi phục${when}: ${d.txs.length} giao dịch, ${d.savs.length} sổ tiết kiệm, ${d.golds.length} giao dịch vàng, ${d.reals.length} nhà đất.`, true);
  } catch(e){
    BK.busy = false;
    bkMsg(e && e.code === "invalid_argument" ? "Bạn chỉ có quyền xem, không khôi phục được." : e && e.message ? e.message : "Chưa khôi phục được.");
  }
}

$("#backToPw").addEventListener("click", () => { S.recMode = false; renderLock(); setTimeout(() => $("#lockPw").focus(), 50); });
async function tryRecover(){
  const err = $("#recErr"), btn = $("#recGo");
  const code = normCode($("#recCode").value), p1 = $("#recPw").value, p2 = $("#recPw2").value;
  const wait = Math.ceil((S.blockUntil - Date.now()) / 1000);
  if (wait > 0){ err.textContent = `Nhập sai nhiều lần. Thử lại sau ${wait} giây.`; return; }
  if (code.length < 6){ err.textContent = "Nhập mã khôi phục."; return; }
  if (p1.length < 6){ err.textContent = "Mật khẩu mới cần ít nhất 6 ký tự."; return; }
  if (p1 !== p2){ err.textContent = "Hai lần nhập mật khẩu không khớp."; return; }
  btn.disabled = true; err.textContent = ""; btn.textContent = "Đang kiểm tra…";
  let res = false;
  try { res = await recoverWithCode(code, p1); } catch(e){ res = false; }
  btn.disabled = false; btn.textContent = "Khôi phục và mở sổ";
  if (res){
    S.fails = 0; ["#recCode","#recPw","#recPw2"].forEach(s => $(s).value = "");
    toast(res === "saved" ? "Đã đặt mật khẩu mới" : "Đã mở sổ, nhưng chỉ chủ sở hữu mới lưu được mật khẩu mới");
    return;
  }
  S.fails++;
  if (S.fails >= 5){ S.blockUntil = Date.now() + 30000 * (S.fails - 4); err.textContent = "Sai mã khôi phục. Tạm khóa 30 giây."; }
  else err.textContent = `Sai mã khôi phục (${S.fails}/5).`;
}
$("#recGo").addEventListener("click", tryRecover);
$("#recPw2").addEventListener("keydown", e => { if (e.key === "Enter") tryRecover(); });
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden){ hiddenAt = Date.now(); return; }
  const m = getAutoLock();
  if (S.lock && S.key && m > 0 && hiddenAt && Date.now() - hiddenAt >= m * 60000) lockNow();
});

render();
initStore();
})();
</script>
</body>
</html>
